name: audio-lab-pro
x-app: &app
  image: audio-lab-pro:local
  build: .
  restart: unless-stopped
  env_file: .env
  environment: &env
    DATABASE_URL: postgresql+psycopg://audio:${POSTGRES_PASSWORD:-local-audio-password}@db:5432/audio
    REDIS_URL: redis://redis:6379/0
    STORAGE_ROOT: /data
  volumes:
    - audio_storage:/data
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
    migrate: {condition: service_completed_successfully}
  stop_grace_period: 45s
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  mem_limit: 2g
  cpus: 2
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: audio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-audio-password}
      POSTGRES_DB: audio
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U audio -d audio']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
  redis:
    image: redis:7
    command: [redis-server, --appendonly, 'yes', --maxmemory, 256mb, --maxmemory-policy, noeviction]
    restart: unless-stopped
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m
  migrate:
    image: audio-lab-pro:local
    build: .
    env_file: .env
    environment: *env
    command: [alembic, upgrade, head]
    depends_on:
      db: {condition: service_healthy}
    restart: 'no'
  web:
    <<: *app
    ports: ['127.0.0.1:8000:8000']
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8000/api/ready]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  worker:
    <<: *app
    command: [celery, -A, app.tasks.celery_app:celery, worker, --loglevel=INFO, --concurrency=2, --hostname=audio@%h]
    healthcheck:
      test: [CMD-SHELL, 'celery -A app.tasks.celery_app:celery inspect ping -d audio@$$HOSTNAME --timeout=5 | grep -q pong']
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 3g
  scheduler:
    <<: *app
    command: [celery, -A, app.tasks.celery_app:celery, beat, --loglevel=INFO, --schedule=/data/celerybeat-schedule, --scheduler=app.tasks.scheduler:HealthScheduler]
    healthcheck:
      test: [CMD, python, -m, app.tasks.scheduler_health]
      interval: 30s
      timeout: 5s
      retries: 3
  nginx:
    image: nginx:alpine
    profiles: [production]
    restart: unless-stopped
    ports: ['127.0.0.1:8080:80']
    volumes: ['./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on:
      web: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/api/health]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  audio_storage:
  postgres_data:
  redis_data:
