services:
  web:
    command: [uvicorn, app.main:app, --host, '0.0.0.0', --port, '8000', --reload, --no-access-log]
    volumes: ['./app:/app/app:ro', 'dev_css:/app/app/static/css', 'dev_vendor:/app/app/static/vendor']
    environment:
      DEBUG: 'true'
  worker:
    volumes: ['./app:/app/app:ro', 'dev_css:/app/app/static/css', 'dev_vendor:/app/app/static/vendor']
volumes:
  dev_css:
  dev_vendor:
